<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/><stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#fff" opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1150" cy="470" r="460" fill="url(#glow)"/>

  <!-- skyline -->
  <g fill="#081126" opacity="0.55">
    <rect x="0" y="600" width="130" height="300"/><rect x="150" y="520" width="160" height="380"/>
    <rect x="330" y="640" width="110" height="260"/><rect x="1330" y="560" width="130" height="340"/>
    <rect x="1480" y="480" width="150" height="420"/>
  </g>
  <g fill="#fbbf24" opacity="0.5">
    <rect x="175" y="550" width="16" height="16"/><rect x="215" y="550" width="16" height="16"/><rect x="255" y="590" width="16" height="16"/>
    <rect x="175" y="630" width="16" height="16"/><rect x="255" y="550" width="16" height="16"/><rect x="215" y="630" width="16" height="16"/>
    <rect x="1505" y="520" width="16" height="16"/><rect x="1545" y="560" width="16" height="16"/><rect x="1505" y="600" width="16" height="16"/>
    <rect x="1355" y="600" width="16" height="16"/><rect x="1395" y="640" width="16" height="16"/>
  </g>

  <!-- floor -->
  <rect y="835" width="1600" height="65" fill="#081126" opacity="0.5"/>
  <ellipse cx="1100" cy="842" rx="230" ry="16" fill="#000" opacity="0.35"/>

  <!-- headline -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="110" y="330" font-size="76" font-weight="700" fill="#ffffff">Fresh talent.</text>
    <text x="110" y="416" font-size="76" font-weight="700" fill="url(#hl)">Real impact.</text>
    <text x="110" y="476" font-size="26" fill="#c7d2fe">From campus to career, one offer letter at a time.</text>
    <g font-size="18" font-weight="600" fill="#e0e7ff">
      <rect x="110" y="520" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="136" y="547">Campus drives</text>
      <rect x="276" y="520" width="140" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="300" y="547">Shortlisting</text>
      <rect x="432" y="520" width="102" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="456" y="547">Offers</text>
    </g>
  </g>

  <!-- offer letter card -->
  <g transform="translate(1005 290)" filter="url(#shadow)">
    <rect width="190" height="124" rx="16" fill="#ffffff"/>
    <circle cx="40" cy="42" r="20" fill="#22c55e"/>
    <path d="M30 42 l8 8 l14 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a1630">Offer Letter</text>
    <text x="72" y="60" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Congratulations!</text>
    <rect x="20" y="86" width="150" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="20" y="102" width="100" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- floating pills -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" filter="url(#shadow)">
    <rect x="850" y="430" width="130" height="44" rx="22" fill="#22c55e"/>
    <text x="878" y="458" fill="#fff">Selected</text>
    <rect x="1250" y="400" width="164" height="44" rx="22" fill="#f59e0b"/>
    <text x="1276" y="428" fill="#fff">Welcome aboard</text>
  </g>

  <!-- fresher (left) -->
  <g>
    <rect x="973" y="770" width="24" height="64" rx="6" fill="#0f2a5c"/><rect x="1005" y="770" width="24" height="64" rx="6" fill="#0f2a5c"/>
    <rect x="967" y="824" width="34" height="12" rx="6" fill="#0a1630"/><rect x="1001" y="824" width="34" height="12" rx="6" fill="#0a1630"/>
    <rect x="960" y="592" width="80" height="190" rx="30" fill="url(#teal)"/>
    <rect x="992" y="574" width="16" height="22" rx="6" fill="#e9b98f"/>
    <path d="M984 592 l16 22 l16 -22z" fill="#fff"/>
    <line x1="1000" y1="612" x2="1000" y2="640" stroke="#fbbf24" stroke-width="3"/>
    <rect x="988" y="640" width="24" height="30" rx="4" fill="#fff"/>
    <rect x="993" y="647" width="14" height="4" rx="2" fill="#2563eb"/>
    <circle cx="1000" cy="546" r="38" fill="#f3cfae"/>
    <path d="M962 542 a38 38 0 0 1 76 0 q-38 -26 -76 0z" fill="#2a1d14"/>
    <path d="M988 560 q12 10 24 0" fill="none" stroke="#9a5b3a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="988" cy="548" r="3" fill="#2a1d14"/><circle cx="1012" cy="548" r="3" fill="#2a1d14"/>
    <line x1="1030" y1="634" x2="1100" y2="692" stroke="#0d9488" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- recruiter (right) -->
  <g>
    <rect x="1173" y="770" width="24" height="64" rx="6" fill="#1e293b"/><rect x="1205" y="770" width="24" height="64" rx="6" fill="#1e293b"/>
    <rect x="1167" y="824" width="34" height="12" rx="6" fill="#020617"/><rect x="1201" y="824" width="34" height="12" rx="6" fill="#020617"/>
    <rect x="1160" y="592" width="80" height="190" rx="30" fill="#f1f5f9"/>
    <rect x="1192" y="574" width="16" height="22" rx="6" fill="#d9a77c"/>
    <path d="M1184 592 l16 26 l16 -26z" fill="#fff"/>
    <path d="M1193 604 l7 12 l7 -12z M1196 616 l4 44 l4 -44z" fill="#2563eb"/>
    <circle cx="1200" cy="546" r="38" fill="#d9a77c"/>
    <path d="M1162 540 a38 38 0 0 1 76 0 q-38 -20 -76 0z" fill="#111827"/>
    <path d="M1188 560 q12 10 24 0" fill="none" stroke="#7c4a2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1188" cy="548" r="3" fill="#111827"/><circle cx="1212" cy="548" r="3" fill="#111827"/>
    <line x1="1170" y1="634" x2="1100" y2="692" stroke="#e2e8f0" stroke-width="28" stroke-linecap="round"/>
    <circle cx="1100" cy="694" r="16" fill="#d9a77c"/>
  </g>

  <!-- sparkles -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="930" cy="360" r="6"/><circle cx="1290" cy="330" r="5"/><circle cx="1230" cy="250" r="4"/>
  </g>
  <g fill="#22d3ee" opacity="0.8">
    <circle cx="960" cy="260" r="4"/><circle cx="1340" cy="500" r="5"/><circle cx="900" cy="560" r="4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
